server.port=8082

spring.ai.mcp.client.name=payment-ai-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.payment-server.url=http://localhost:8081

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b

spring.ai.ollama.embedding.options.model=embeddinggemma

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer